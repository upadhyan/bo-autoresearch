# The benchmark with Ax (#47): kept apart so Ax and torch never reach the plugin's environment.
[project]
name = "boar-benchmark"
version = "0"
requires-python = ">=3.11"
dependencies = ["boar", "ax-platform>=1.3,<1.4", "torch"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
boar = { path = "../plugin/harness", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
