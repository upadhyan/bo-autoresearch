[project]
name = "boar"
version = "0.2.0"
description = "BOAR harness: Bayesian Optimization AutoResearch run state, trials and reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["optuna>=5.0"]

[project.scripts]
boar = "boar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
