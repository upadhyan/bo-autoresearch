# The dogfood benchmark (#38): 3 seeds x 2 noise levels in scripted mode plus 1 free-generation run, each a
# headless `claude -p "/boautoresearch:start"` on a fresh copy of benchmarks/dogfood/toy, with the
# adversarial checklist fired from outside the LLM. check.py's output for every run is attached.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions), from
# `claude setup-token` on a subscription with enough usage for 7 long agent sessions. Runs on demand only
# (Actions > dogfood > Run workflow); forks run it with their own secret.
name: dogfood
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code and the driver's one dependency
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install pyyaml
      - name: Run the matrix
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python benchmarks/dogfood/run_benchmark.py --caller claude --work "${{ runner.temp }}/dogfood-runs"
      - name: Attach check.py output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-results
          path: |
            ${{ runner.temp }}/dogfood-runs/matrix.json
            ${{ runner.temp }}/dogfood-runs/*/check.txt
            ${{ runner.temp }}/dogfood-runs/*/check.json
            ${{ runner.temp }}/dogfood-runs/*/adversarial.json
            ${{ runner.temp }}/dogfood-runs/*/caller.log
            ${{ runner.temp }}/dogfood-runs/*/project/.bo-research/*/log.db
            ${{ runner.temp }}/dogfood-runs/*/project/.bo-research/*/SUMMARY.md
            ${{ runner.temp }}/dogfood-runs/*/project/.bo-research/*/REPORT.md
            ${{ runner.temp }}/dogfood-runs/*/project/.bo-research/*/exports/
      - name: Summary
        if: always()
        run: cat "${{ runner.temp }}"/dogfood-runs/*/check.txt >> "$GITHUB_STEP_SUMMARY" || true
